<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="152" height="62" viewBox="0 0 152 62">
  <title>NX panel background — opaque (no compositing)</title>
  <defs>
    <linearGradient id="nx-edge-v" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="52">
      <stop offset="0.0" stop-color="#ffffff" stop-opacity="0.0868"/>
      <stop offset="1.0" stop-color="#ffffff" stop-opacity="0.0124"/>
    </linearGradient>
    <linearGradient id="nx-edge-vr" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="52">
      <stop offset="0.0" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1.0" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="nx-fill-thick" gradientUnits="userSpaceOnUse" x1="0" y1="76" x2="0" y2="108">
      <stop offset="0.0" stop-color="#171028" stop-opacity="1.0"/>
      <stop offset="1.0" stop-color="#171028" stop-opacity="1.0"/>
    </linearGradient>
  </defs>
  <!-- frame -->
  <g id="topleft">
    <path d="M 0,15 H 5 V 10 A 5,5 0 0 0 0,15 Z" fill="#171028"/>
    <path d="M 5,10 A 5,5 0 0 0 0,15 H 1 A 4,4 0 0 1 5,11 Z" fill="#ffffff" fill-opacity="0.149"/>
  </g>
  <g id="top">
    <rect x="5" y="10" width="32" height="5" fill="#171028"/>
    <rect x="5" y="10" width="32" height="1" fill="#ffffff" fill-opacity="0.112"/>
  </g>
  <g id="topright">
    <path d="M 37,10 V 15 H 42 A 5,5 0 0 0 37,10 Z" fill="#171028"/>
    <path d="M 42,15 A 5,5 0 0 0 37,10 V 11 A 4,4 0 0 1 41,15 Z" fill="#ffffff" fill-opacity="0.081"/>
  </g>
  <g id="left">
    <rect x="0" y="15" width="5" height="32" fill="#171028"/>
    <rect x="0" y="15" width="1" height="32" fill="url(#nx-edge-v)"/>
  </g>
  <g id="center">
    <rect x="5" y="15" width="32" height="32" fill="#171028"/>
  </g>
  <g id="right">
    <rect x="37" y="15" width="5" height="32" fill="#171028"/>
    <rect x="41" y="15" width="1" height="32" fill="url(#nx-edge-vr)"/>
  </g>
  <g id="bottomleft">
    <path d="M 5,52 V 47 H 0 A 5,5 0 0 0 5,52 Z" fill="#171028"/>
    <path d="M 0,47 A 5,5 0 0 0 5,52 V 51 A 4,4 0 0 1 1,47 Z" fill="#000000" fill-opacity="0.16"/>
  </g>
  <g id="bottom">
    <rect x="5" y="47" width="32" height="5" fill="#171028"/>
    <rect x="5" y="51" width="32" height="1" fill="#000000" fill-opacity="0.22"/>
  </g>
  <g id="bottomright">
    <path d="M 37,52 V 47 H 42 A 5,5 0 0 1 37,52 Z" fill="#171028"/>
    <path d="M 42,47 A 5,5 0 0 1 37,52 V 51 A 4,4 0 0 0 41,47 Z" fill="#000000" fill-opacity="0.16"/>
  </g>
  <!-- hints (never painted; only presence/bounds are read) -->
  <rect id="hint-stretch-borders" x="0" y="0" width="5" height="5" fill="#008000"/>
  <rect id="hint-top-margin" x="20" y="10" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-bottom-margin" x="20" y="48" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-left-margin" x="0" y="29" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-right-margin" x="38" y="29" width="4" height="4" fill="#ff00ff"/>
  <!-- thick panel -->
  <rect id="thick-center" x="5" y="76" width="32" height="32" fill="url(#nx-fill-thick)"/>
  <rect id="thick-hint-top-margin" x="5" y="68" width="4" height="8" fill="#800080"/>
  <rect id="thick-hint-bottom-margin" x="13" y="108" width="4" height="8" fill="#800080"/>
  <rect id="thick-hint-left-margin" x="0" y="76" width="8" height="4" fill="#800080"/>
  <rect id="thick-hint-right-margin" x="42" y="76" width="8" height="4" fill="#800080"/>
  <!-- mask: opaque silhouette, gives KWin the blur-behind region -->
  <path id="mask-topleft" d="M 110,15 H 115 V 10 A 5,5 0 0 0 110,15 Z" fill="#000000"/>
  <rect id="mask-top" x="115" y="10" width="32" height="5" fill="#000000"/>
  <path id="mask-topright" d="M 147,10 V 15 H 152 A 5,5 0 0 0 147,10 Z" fill="#000000"/>
  <rect id="mask-left" x="110" y="15" width="5" height="32" fill="#000000"/>
  <rect id="mask-center" x="115" y="15" width="32" height="32" fill="#000000"/>
  <rect id="mask-right" x="147" y="15" width="5" height="32" fill="#000000"/>
  <path id="mask-bottomleft" d="M 115,52 V 47 H 110 A 5,5 0 0 0 115,52 Z" fill="#000000"/>
  <rect id="mask-bottom" x="115" y="47" width="32" height="5" fill="#000000"/>
  <path id="mask-bottomright" d="M 147,52 V 47 H 152 A 5,5 0 0 1 147,52 Z" fill="#000000"/>
</svg>
