<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="170" height="68" viewBox="0 0 170 68">
  <title>NX panel background — opaque (no compositing)</title>
  <defs>
    <linearGradient id="nx-edge-v" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="58">
      <stop offset="0.0" stop-color="#ffffff" stop-opacity="0.0868"/>
      <stop offset="1.0" stop-color="#ffffff" stop-opacity="0.0124"/>
    </linearGradient>
    <linearGradient id="nx-edge-vr" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="58">
      <stop offset="0.0" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1.0" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="nx-fill-thick" gradientUnits="userSpaceOnUse" x1="0" y1="82" x2="0" y2="114">
      <stop offset="0.0" stop-color="#171028" stop-opacity="1.0"/>
      <stop offset="1.0" stop-color="#171028" stop-opacity="1.0"/>
    </linearGradient>
  </defs>
  <!-- frame -->
  <g id="topleft">
    <path d="M 0,18 H 8 V 10 A 8,8 0 0 0 0,18 Z" fill="#171028"/>
    <path d="M 8,10 A 8,8 0 0 0 0,18 H 1 A 7,7 0 0 1 8,11 Z" fill="#ffffff" fill-opacity="0.149"/>
  </g>
  <g id="top">
    <rect x="8" y="10" width="32" height="8" fill="#171028"/>
    <rect x="8" y="10" width="32" height="1" fill="#ffffff" fill-opacity="0.112"/>
  </g>
  <g id="topright">
    <path d="M 40,10 V 18 H 48 A 8,8 0 0 0 40,10 Z" fill="#171028"/>
    <path d="M 48,18 A 8,8 0 0 0 40,10 V 11 A 7,7 0 0 1 47,18 Z" fill="#ffffff" fill-opacity="0.081"/>
  </g>
  <g id="left">
    <rect x="0" y="18" width="8" height="32" fill="#171028"/>
    <rect x="0" y="18" width="1" height="32" fill="url(#nx-edge-v)"/>
  </g>
  <g id="center">
    <rect x="8" y="18" width="32" height="32" fill="#171028"/>
  </g>
  <g id="right">
    <rect x="40" y="18" width="8" height="32" fill="#171028"/>
    <rect x="47" y="18" width="1" height="32" fill="url(#nx-edge-vr)"/>
  </g>
  <g id="bottomleft">
    <path d="M 8,58 V 50 H 0 A 8,8 0 0 0 8,58 Z" fill="#171028"/>
    <path d="M 0,50 A 8,8 0 0 0 8,58 V 57 A 7,7 0 0 1 1,50 Z" fill="#000000" fill-opacity="0.16"/>
  </g>
  <g id="bottom">
    <rect x="8" y="50" width="32" height="8" fill="#171028"/>
    <rect x="8" y="57" width="32" height="1" fill="#000000" fill-opacity="0.22"/>
  </g>
  <g id="bottomright">
    <path d="M 40,58 V 50 H 48 A 8,8 0 0 1 40,58 Z" fill="#171028"/>
    <path d="M 48,50 A 8,8 0 0 1 40,58 V 57 A 7,7 0 0 0 47,50 Z" fill="#000000" fill-opacity="0.16"/>
  </g>
  <!-- hints (never painted; only presence/bounds are read) -->
  <rect id="hint-stretch-borders" x="0" y="0" width="5" height="5" fill="#008000"/>
  <rect id="hint-top-margin" x="20" y="10" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-bottom-margin" x="20" y="54" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-left-margin" x="0" y="32" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-right-margin" x="44" y="32" width="4" height="4" fill="#ff00ff"/>
  <!-- thick panel -->
  <rect id="thick-center" x="8" y="82" width="32" height="32" fill="url(#nx-fill-thick)"/>
  <rect id="thick-hint-top-margin" x="8" y="74" width="4" height="8" fill="#800080"/>
  <rect id="thick-hint-bottom-margin" x="16" y="114" width="4" height="8" fill="#800080"/>
  <rect id="thick-hint-left-margin" x="0" y="82" width="8" height="4" fill="#800080"/>
  <rect id="thick-hint-right-margin" x="48" y="82" width="8" height="4" fill="#800080"/>
  <!-- mask: opaque silhouette, gives KWin the blur-behind region -->
  <path id="mask-topleft" d="M 122,18 H 130 V 10 A 8,8 0 0 0 122,18 Z" fill="#000000"/>
  <rect id="mask-top" x="130" y="10" width="32" height="8" fill="#000000"/>
  <path id="mask-topright" d="M 162,10 V 18 H 170 A 8,8 0 0 0 162,10 Z" fill="#000000"/>
  <rect id="mask-left" x="122" y="18" width="8" height="32" fill="#000000"/>
  <rect id="mask-center" x="130" y="18" width="32" height="32" fill="#000000"/>
  <rect id="mask-right" x="162" y="18" width="8" height="32" fill="#000000"/>
  <path id="mask-bottomleft" d="M 130,58 V 50 H 122 A 8,8 0 0 0 130,58 Z" fill="#000000"/>
  <rect id="mask-bottom" x="130" y="50" width="32" height="8" fill="#000000"/>
  <path id="mask-bottomright" d="M 162,58 V 50 H 170 A 8,8 0 0 1 162,58 Z" fill="#000000"/>
</svg>
