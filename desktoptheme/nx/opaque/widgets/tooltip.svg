<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="146" height="60" viewBox="0 0 146 60">
  <title>NX tooltip background — opaque (no compositing)</title>
  <defs>
    <linearGradient id="nx-edge-lit" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="40" y2="50">
      <stop offset="0.0" stop-color="#e2c8ff" stop-opacity="0.3844"/>
      <stop offset="0.24" stop-color="#9a3cff" stop-opacity="0.186"/>
      <stop offset="0.52" stop-color="#00e5ff" stop-opacity="0.062"/>
      <stop offset="1.0" stop-color="#000000" stop-opacity="0.186"/>
    </linearGradient>
  </defs>
  <!-- frame -->
  <g id="topleft">
    <path d="M 0,14 H 4 V 10 A 4,4 0 0 0 0,14 Z" fill="#1d1433"/>
    <path d="M 4,10 A 4,4 0 0 0 0,14 H 1 A 3,3 0 0 1 4,11 Z" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="top">
    <rect x="4" y="10" width="32" height="4" fill="#1d1433"/>
    <rect x="4" y="10" width="32" height="1" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="topright">
    <path d="M 36,10 V 14 H 40 A 4,4 0 0 0 36,10 Z" fill="#1d1433"/>
    <path d="M 40,14 A 4,4 0 0 0 36,10 V 11 A 3,3 0 0 1 39,14 Z" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="left">
    <rect x="0" y="14" width="4" height="32" fill="#1d1433"/>
    <rect x="0" y="14" width="1" height="32" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="center">
    <rect x="4" y="14" width="32" height="32" fill="#1d1433"/>
  </g>
  <g id="right">
    <rect x="36" y="14" width="4" height="32" fill="#1d1433"/>
    <rect x="39" y="14" width="1" height="32" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="bottomleft">
    <path d="M 4,50 V 46 H 0 A 4,4 0 0 0 4,50 Z" fill="#1d1433"/>
    <path d="M 0,46 A 4,4 0 0 0 4,50 V 49 A 3,3 0 0 1 1,46 Z" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="bottom">
    <rect x="4" y="46" width="32" height="4" fill="#1d1433"/>
    <rect x="4" y="49" width="32" height="1" fill="url(#nx-edge-lit)"/>
  </g>
  <g id="bottomright">
    <path d="M 36,50 V 46 H 40 A 4,4 0 0 1 36,50 Z" fill="#1d1433"/>
    <path d="M 40,46 A 4,4 0 0 1 36,50 V 49 A 3,3 0 0 0 39,46 Z" fill="url(#nx-edge-lit)"/>
  </g>
  <!-- hints (never painted; only presence/bounds are read) -->
  <rect id="hint-stretch-borders" x="0" y="0" width="5" height="5" fill="#008000"/>
  <rect id="hint-top-margin" x="20" y="10" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-bottom-margin" x="20" y="46" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-left-margin" x="0" y="28" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-right-margin" x="36" y="28" width="4" height="4" fill="#ff00ff"/>
  <!-- mask: opaque silhouette, gives KWin the blur-behind region -->
  <path id="mask-topleft" d="M 106,14 H 110 V 10 A 4,4 0 0 0 106,14 Z" fill="#000000"/>
  <rect id="mask-top" x="110" y="10" width="32" height="4" fill="#000000"/>
  <path id="mask-topright" d="M 142,10 V 14 H 146 A 4,4 0 0 0 142,10 Z" fill="#000000"/>
  <rect id="mask-left" x="106" y="14" width="4" height="32" fill="#000000"/>
  <rect id="mask-center" x="110" y="14" width="32" height="32" fill="#000000"/>
  <rect id="mask-right" x="142" y="14" width="4" height="32" fill="#000000"/>
  <path id="mask-bottomleft" d="M 110,50 V 46 H 106 A 4,4 0 0 0 110,50 Z" fill="#000000"/>
  <rect id="mask-bottom" x="110" y="46" width="32" height="4" fill="#000000"/>
  <path id="mask-bottomright" d="M 142,50 V 46 H 146 A 4,4 0 0 1 142,50 Z" fill="#000000"/>
</svg>
