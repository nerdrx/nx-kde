      <stop offset="0.2857" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.1078"/>
      <stop offset="0.7143" stop-color="#000000" stop-opacity="0.0352"/>
