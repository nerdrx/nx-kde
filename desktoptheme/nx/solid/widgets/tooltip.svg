    <rect x="57" y="46" width="32" height="4" fill="#000000" fill-opacity="0.001"/>
  </g>
  <g id="shadow-bottomright">
    <path d="M 93,46 A 4,4 0 0 1 89,50 V 60 H 103 V 46 Z" fill="url(#nx-shc-bottomright)"/>
    <path d="M 89,50 V 46 H 93 A 4,4 0 0 1 89,50 Z" fill="#000000" fill-opacity="0.001"/>
  </g>
