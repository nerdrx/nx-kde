      <stop offset="0.0" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="0.3" stop-color="#000000" stop-opacity="0.0735"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.024"/>
      <stop offset="1.0" stop-color="#000000" stop-opacity="0.0"/>
