  <rect id="mask-top" x="110" y="10" width="32" height="4" fill="#000000"/>
  <path id="mask-topright" d="M 142,10 V 14 H 146 A 4,4 0 0 0 142,10 Z" fill="#000000"/>
  <rect id="mask-left" x="106" y="14" width="4" height="32" fill="#000000"/>
  <rect id="mask-center" x="110" y="14" width="32" height="32" fill="#000000"/>
  <rect id="mask-right" x="142" y="14" width="4" height="32" fill="#000000"/>
  <path id="mask-bottomleft" d="M 110,50 V 46 H 106 A 4,4 0 0 0 110,50 Z" fill="#000000"/>
  <rect id="mask-bottom" x="110" y="46" width="32" height="4" fill="#000000"/>
  <path id="mask-bottomright" d="M 142,50 V 46 H 146 A 4,4 0 0 1 142,50 Z" fill="#000000"/>
  <!-- shadow (the 0.001-alpha rects only pad element bounds) -->
  <g id="shadow-topleft">
