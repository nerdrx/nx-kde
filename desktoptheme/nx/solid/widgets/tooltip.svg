  <rect id="shadow-hint-bottom-inset" x="77" y="50" width="2" height="10" fill="#00ff00"/>
  <rect id="shadow-hint-left-inset" x="43" y="24" width="10" height="2" fill="#00ff00"/>
  <rect id="shadow-hint-right-inset" x="93" y="20" width="10" height="2" fill="#00ff00"/>
</svg>
