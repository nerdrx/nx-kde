    <path d="M 89,10 V 14 H 93 A 4,4 0 0 0 89,10 Z" fill="#000000" fill-opacity="0.001"/>
  </g>
  <g id="shadow-left">
    <rect x="43" y="14" width="10" height="32" fill="url(#nx-sh-left)"/>
    <rect x="53" y="14" width="4" height="32" fill="#000000" fill-opacity="0.001"/>
  </g>
  <g id="shadow-center">
    <rect x="57" y="14" width="32" height="32" fill="#000000" fill-opacity="0.001"/>
  </g>
  <g id="shadow-right">
    <rect x="93" y="14" width="10" height="32" fill="url(#nx-sh-right)"/>
    <rect x="89" y="14" width="4" height="32" fill="#000000" fill-opacity="0.001"/>
  </g>
  <g id="shadow-bottomleft">
