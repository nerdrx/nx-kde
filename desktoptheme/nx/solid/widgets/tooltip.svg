  <rect id="hint-top-margin" x="20" y="10" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-bottom-margin" x="20" y="46" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-left-margin" x="0" y="28" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-right-margin" x="36" y="28" width="4" height="4" fill="#ff00ff"/>
  <rect id="hint-top-inset" x="20" y="10" width="4" height="0.00000001" fill="#00ff00"/>
  <rect id="hint-bottom-inset" x="20" y="50" width="4" height="0.00000001" fill="#00ff00"/>
  <rect id="hint-left-inset" x="0" y="28" width="0.00000001" height="4" fill="#00ff00"/>
  <rect id="hint-right-inset" x="40" y="28" width="0.00000001" height="4" fill="#00ff00"/>
