[General]
# Every key here is consumed by Main.qml as config.<key>; the breeze QML
# exposes no other configuration surface (config.type, config.color,
# config.background, config.showlogo, config.logo, config.showClock).
#
# The background is supplied by the installer: it copies the NX-Nebula
# wallpaper (contents/images/3840x2160.png) into this directory as
# background.png. A generated placeholder gradient ships in the repo so the
# theme is never broken.
type=image
background=background.png

# Fallback field colour, used when type != image or the image fails to load.
# --bg-top from the NX design language.
color=#0a0714

# The NX mark, revealed with the clock once the login UI idles out.
showlogo=shown
logo=logo.svg

showClock=true
fontSize=10
needsFullUserModel=false
